  <!-- Early theme boot script to completely eliminate theme flashing -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("soulspace.theme") || localStorage.getItem("soulspace-theme");
        var cfgTheme = "dark";
        var theme = saved || (cfgTheme !== "system" ? cfgTheme : "system");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = theme === "dark" || (theme === "system" && prefersDark);
        if (isDark) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      } catch (_) {}
    })();
  </script>

  <script>
    // Initialize Lucide icons
    if (window.lucide) {
      lucide.createIcons();
    }

    // 1. Responsive Sidebar Drawer Toggle
    let sidebarOpenMobile = false;
    let sidebarOpenDesktop = true;

    function toggleSidebar() {
      const sidebar = document.getElementById('guest-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const floatBtn = document.getElementById('floating-sidebar-btn');
      if (!sidebar) return;

      const isMobile = window.innerWidth < 768;

      if (isMobile) {
        sidebarOpenMobile = !sidebarOpenMobile;
        if (sidebarOpenMobile) {
          sidebar.classList.remove('-translate-x-full');
          sidebar.classList.add('translate-x-0');
          if (backdrop) {
            backdrop.classList.remove('hidden');
            requestAnimationFrame(() => {
              backdrop.classList.remove('opacity-0', 'pointer-events-none');
              backdrop.classList.add('opacity-100', 'pointer-events-auto');
            });
          }
          document.body.classList.add('overflow-hidden');
        } else {
          sidebar.classList.add('-translate-x-full');
          sidebar.classList.remove('translate-x-0');
          if (backdrop) {
            backdrop.classList.remove('opacity-100', 'pointer-events-auto');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
              if (!sidebarOpenMobile) backdrop.classList.add('hidden');
            }, 200);
          }
          document.body.classList.remove('overflow-hidden');
        }
      } else {
        sidebarOpenDesktop = !sidebarOpenDesktop;
        if (sidebarOpenDesktop) {
          sidebar.classList.remove('md:hidden');
          if (floatBtn) {
            floatBtn.classList.remove('md:opacity-100', 'md:pointer-events-auto');
            floatBtn.classList.add('md:opacity-0', 'md:pointer-events-none');
          }
        } else {
          sidebar.classList.add('md:hidden');
          if (floatBtn) {
            floatBtn.classList.remove('md:opacity-0', 'md:pointer-events-none');
            floatBtn.classList.add('md:opacity-100', 'md:pointer-events-auto');
          }
        }
      }
    }

    function closeSidebarOnMobile() {
      if (window.innerWidth < 768 && sidebarOpenMobile) {
        toggleSidebar();
      }
    }

    // Floating Table of Contents Hover, Pin, and Interaction
    let floatingTocPinned = false;
    let floatingTocLeaveTimer = null;

    function openFloatingToc() {
      if (floatingTocLeaveTimer) {
        clearTimeout(floatingTocLeaveTimer);
        floatingTocLeaveTimer = null;
      }
      const card = document.getElementById('floating-toc-card');
      if (card) {
        card.classList.remove('hidden');
        card.classList.add('flex');
      }
    }

    function closeFloatingToc() {
      if (floatingTocPinned) return;
      floatingTocLeaveTimer = setTimeout(() => {
        const card = document.getElementById('floating-toc-card');
        if (card && !floatingTocPinned) {
          card.classList.add('hidden');
          card.classList.remove('flex');
        }
      }, 240);
    }

    function toggleFloatingToc() {
      const card = document.getElementById('floating-toc-card');
      if (!card) return;
      if (card.classList.contains('hidden')) {
        openFloatingToc();
      } else if (!floatingTocPinned) {
        card.classList.add('hidden');
        card.classList.remove('flex');
      }
    }

    function togglePinFloatingToc(e) {
      if (e) e.stopPropagation();
      floatingTocPinned = !floatingTocPinned;
      const pinBtn = document.getElementById('floating-toc-pin');
      if (pinBtn) {
        if (floatingTocPinned) {
          pinBtn.classList.add('bg-primary/20', 'text-indigo-600', 'dark:text-indigo-400');
        } else {
          pinBtn.classList.remove('bg-primary/20', 'text-indigo-600', 'dark:text-indigo-400');
        }
      }
    }

    const floatingRoot = document.getElementById('floating-toc-root');
    if (floatingRoot) {
      floatingRoot.addEventListener('mouseenter', openFloatingToc);
      floatingRoot.addEventListener('mouseleave', closeFloatingToc);
    }

    // 2. Heading Smooth Scroll with Drawer Auto-close
    function scrollToHeading(id) {
      closeSidebarOnMobile();
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      if (!floatingTocPinned) {
        const card = document.getElementById('floating-toc-card');
        if (card) {
          setTimeout(() => {
            if (!floatingTocPinned) {
              card.classList.add('hidden');
              card.classList.remove('flex');
            }
          }, 200);
        }
      }
    }

    // 3. Table of Contents ScrollSpy
    function initScrollSpy() {
      const headings = document.querySelectorAll('article h1[id], article h2[id], article h3[id]');
      if (!headings.length) return;
      const tocButtons = document.querySelectorAll('[data-toc-id]');
      const dashes = document.querySelectorAll('[data-toc-dash]');

      function updateActive() {
        let activeId = headings[0].id;
        const scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const docHeight = document.documentElement.scrollHeight || document.body.scrollHeight;

        if (scrollY + windowHeight >= docHeight - 30) {
          activeId = headings[headings.length - 1].id;
        } else {
          const viewportThreshold = 140;
          for (let i = 0; i < headings.length; i++) {
            const h = headings[i];
            const rect = h.getBoundingClientRect();
            if (rect.top <= viewportThreshold) {
              activeId = h.id;
            } else {
              break;
            }
          }
        }

        // Highlight TOC button entries
        tocButtons.forEach(btn => {
          const id = btn.getAttribute('data-toc-id');
          const bullet = btn.querySelector('.toc-bullet');
          if (id === activeId) {
            btn.classList.add('active-toc');
            if (bullet) {
              bullet.classList.add('bg-indigo-600', 'dark:bg-indigo-400', 'scale-125');
              bullet.classList.remove('bg-neutral-400/40');
            }
          } else {
            btn.classList.remove('active-toc');
            if (bullet) {
              bullet.classList.remove('bg-indigo-600', 'dark:bg-indigo-400', 'scale-125');
              bullet.classList.add('bg-neutral-400/40');
            }
          }
        });

        // Highlight Notion vertical dashes
        dashes.forEach(dash => {
          const id = dash.getAttribute('data-toc-dash');
          if (id === activeId) {
            dash.classList.add('h-[3px]', 'bg-black', 'dark:bg-white', 'shadow-[0_0_8px_rgba(255,255,255,0.7)]', 'scale-x-110', 'opacity-100');
            dash.classList.remove('h-[2.5px]', 'bg-neutral-400/40', 'dark:bg-neutral-600', 'opacity-70');
          } else {
            dash.classList.remove('h-[3px]', 'bg-black', 'dark:bg-white', 'shadow-[0_0_8px_rgba(255,255,255,0.7)]', 'scale-x-110', 'opacity-100');
            dash.classList.add('h-[2.5px]', 'bg-neutral-400/40', 'dark:bg-neutral-600', 'opacity-70');
          }
        });

        // Auto-scroll inside floating card if open
        const card = document.getElementById('floating-toc-card');
        if (card && !card.classList.contains('hidden')) {
          try {
            const escaped = typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(activeId) : activeId;
            const activeBtn = card.querySelector('[data-toc-id="' + escaped + '"]');
            if (activeBtn) {
              activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
          } catch {}
        }
      }

      window.addEventListener('scroll', updateActive, { passive: true });
      window.addEventListener('resize', updateActive, { passive: true });
      updateActive();
    }
    initScrollSpy();

    // 4. System Theme & Manual Toggle
    function updateThemeIcons(isDark) {
      const iconName = isDark ? 'sun' : 'moon';
      document.querySelectorAll('.theme-icon-container').forEach(el => {
        el.innerHTML = '<i data-lucide="' + iconName + '" class="h-4 w-4"></i>';
      });
      if (window.lucide) lucide.createIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      localStorage.setItem('soulspace.theme', isDark ? 'dark' : 'light');
      localStorage.setItem('soulspace-theme', isDark ? 'dark' : 'light');
      updateThemeIcons(isDark);
    }

    // Set initial icon based on current DOM class
    updateThemeIcons(document.documentElement.classList.contains('dark'));

    // Listen to OS theme changes if user hasn't explicitly set a preference
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        const saved = localStorage.getItem('soulspace.theme') || localStorage.getItem('soulspace-theme');
        if (!saved || saved === 'system') {
          if (e.matches) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            updateThemeIcons(true);
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            updateThemeIcons(false);
          }
        }
      });
    }

    // 5. Page Width Toggle (Standard / Wide / Full)
    const WIDTH_PRESETS = [
      { id: 'standard', class: 'max-w-4xl', icon: 'fold-horizontal', title: 'Page width: Standard (Click for Wide)' },
      { id: 'wide', class: 'max-w-6xl', icon: 'unfold-horizontal', title: 'Page width: Wide (Click for Full)' },
      { id: 'full', class: 'max-w-none', icon: 'maximize-2', title: 'Page width: Full (Click for Standard)' }
    ];

    function applyPageWidth(presetId, save) {
      const container = document.getElementById('main-document-container');
      const iconSpan = document.getElementById('page-width-icon');
      const btn = document.getElementById('page-width-btn');
      const preset = WIDTH_PRESETS.find(p => p.id === presetId) || WIDTH_PRESETS[0];

      if (container) {
        container.classList.remove('max-w-4xl', 'max-w-6xl', 'max-w-none');
        container.classList.add(preset.class);
      }

      if (btn) {
        btn.setAttribute('title', preset.title);
      }

      if (iconSpan) {
        iconSpan.innerHTML = '<i data-lucide="' + preset.icon + '" class="h-3.5 w-3.5"></i>';
        if (window.lucide) {
          lucide.createIcons();
        }
      }

      if (save) {
        try {
          localStorage.setItem('soulspace-page-width', preset.id);
        } catch (_) {}
      }
    }

    function cyclePageWidth() {
      const current = localStorage.getItem('soulspace-page-width') || 'standard';
      const currentIndex = WIDTH_PRESETS.findIndex(p => p.id === current);
      const nextIndex = (currentIndex + 1) % WIDTH_PRESETS.length;
      applyPageWidth(WIDTH_PRESETS[nextIndex].id, true);
    }

    try {
      const savedWidth = localStorage.getItem('soulspace-page-width') || 'standard';
      applyPageWidth(savedWidth, false);
    } catch (_) {}

    // 6. Code Block Copy
    function copyCode(btn) {
      const pre = btn.closest('.group')?.querySelector('pre code');
      if (!pre) return;
      navigator.clipboard.writeText(pre.innerText).then(() => {
        const span = btn.querySelector('span');
        if (span) {
          const orig = span.innerText;
          span.innerText = 'Copied!';
          setTimeout(() => { span.innerText = orig; }, 1800);
        }
      });
    }

    // 6. Interactive Database Engine (Notion / SoulSpace Quality)
    const allDatabases = {};
    const isInteractiveDb = true;

    const COLOR_MAP = {
      gray: {
        badge: 'bg-zinc-500/10 text-zinc-700 dark:text-zinc-300 border-zinc-500/20',
        dot: '#71717a'
      },
      blue: {
        badge: 'bg-sky-500/15 text-sky-700 dark:text-sky-300 border-sky-500/30',
        dot: '#0ea5e9'
      },
      purple: {
        badge: 'bg-purple-500/15 text-purple-700 dark:text-purple-300 border-purple-500/30',
        dot: '#a855f7'
      },
      green: {
        badge: 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border-emerald-500/30',
        dot: '#10b981'
      },
      yellow: {
        badge: 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border-amber-500/30',
        dot: '#f59e0b'
      },
      orange: {
        badge: 'bg-orange-500/15 text-orange-700 dark:text-orange-300 border-orange-500/30',
        dot: '#f97316'
      },
      red: {
        badge: 'bg-rose-500/15 text-rose-700 dark:text-rose-300 border-rose-500/30',
        dot: '#f43f5e'
      },
      pink: {
        badge: 'bg-pink-500/15 text-pink-700 dark:text-pink-300 border-pink-500/30',
        dot: '#ec4899'
      },
      brown: {
        badge: 'bg-amber-950/20 text-amber-800 dark:text-amber-300 border-amber-800/30',
        dot: '#92400e'
      }
    };

    const PROP_ICONS = {
      title: 'type',
      text: 'type',
      status: 'circle-dot',
      select: 'list',
      multi_select: 'list',
      date: 'calendar',
      url: 'link-2',
      number: 'hash',
      checkbox: 'check-square',
      email: 'mail',
      phone: 'phone',
      file: 'paperclip',
      formula: 'calculator'
    };

    function renderSingleDatabase(targetContainer, db) {
      if (!targetContainer || !db || !db.properties || !db.rows) return;

      let currentView = (db.views && db.views[0]?.layout === 'gallery') ? 'gallery' : 'table';
      let search = '';

      function getOptionConfig(prop, val) {
        if (!prop?.config?.options || !val) return null;
        const needle = String(val).toLowerCase();
        return prop.config.options.find(o => o.id === val || o.name.toLowerCase() === needle);
      }

      function formatCellValue(prop, val) {
        if (val === null || val === undefined || val === '') {
          return '<span class="text-[var(--text-dim)]">—</span>';
        }

        if (prop.type === 'title' || prop.id === 'title') {
          return '<span class="font-medium text-[var(--text-main)]">' + escapeHtml(String(val)) + '</span>';
        }

        if (prop.type === 'status') {
          const opt = getOptionConfig(prop, val);
          const colorKey = opt?.color || 'gray';
          const cfg = COLOR_MAP[colorKey] || COLOR_MAP.gray;
          const label = opt ? opt.name : String(val);

          return '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium border ' + cfg.badge + '">' +
            '<span class="h-1.5 w-1.5 rounded-full shrink-0" style="background-color: ' + cfg.dot + '"></span>' +
            '<span>' + escapeHtml(label) + '</span>' +
          '</span>';
        }

        if (prop.type === 'select') {
          const opt = getOptionConfig(prop, val);
          const colorKey = opt?.color || 'blue';
          const cfg = COLOR_MAP[colorKey] || COLOR_MAP.blue;
          const label = opt ? opt.name : String(val);

          return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium border ' + cfg.badge + '">' +
            '<span>' + escapeHtml(label) + '</span>' +
          '</span>';
        }

        if (prop.type === 'multi_select') {
          const arr = Array.isArray(val) ? val : [val];
          return '<div class="flex flex-wrap gap-1">' + arr.map(item => {
            const opt = getOptionConfig(prop, item);
            const colorKey = opt?.color || 'purple';
            const cfg = COLOR_MAP[colorKey] || COLOR_MAP.purple;
            const label = opt ? opt.name : String(item);
            return '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium border ' + cfg.badge + '">' + escapeHtml(label) + '</span>';
          }).join('') + '</div>';
        }

        if (prop.type === 'date') {
          return '<span class="text-[var(--text-muted)] font-mono text-[11px] flex items-center gap-1"><i data-lucide="calendar" class="h-3 w-3 opacity-60"></i> ' + escapeHtml(String(val)) + '</span>';
        }

        if (prop.type === 'url') {
          return '<a href="' + escapeHtml(String(val)) + '" target="_blank" rel="noreferrer" class="text-indigo-600 dark:text-indigo-400 hover:underline truncate max-w-xs block flex items-center gap-1"><span>' + escapeHtml(String(val)) + '</span><i data-lucide="external-link" class="h-3 w-3 opacity-60"></i></a>';
        }

        if (prop.type === 'checkbox') {
          const checked = Boolean(val);
          return checked
            ? '<span class="inline-flex items-center justify-center h-4 w-4 rounded bg-indigo-600 text-white text-[10px]">✓</span>'
            : '<span class="inline-flex items-center justify-center h-4 w-4 rounded border border-[var(--border-color)] text-[var(--text-dim)] text-[10px]"></span>';
        }

        if (prop.type === 'number') {
          const n = Number(val);
          return '<span class="font-mono text-xs text-[var(--text-main)]">' + (isNaN(n) ? escapeHtml(String(val)) : n.toLocaleString()) + '</span>';
        }

        return '<span class="text-[var(--text-main)]">' + escapeHtml(typeof val === 'object' ? JSON.stringify(val) : String(val)) + '</span>';
      }

      function draw() {
        const rows = (db.rows || []).filter(r => {
          if (!search) return true;
          const lower = search.toLowerCase();
          if (r.title && r.title.toLowerCase().includes(lower)) return true;
          return JSON.stringify(r.values || {}).toLowerCase().includes(lower);
        });

        let h = '<div class="rounded-xl border border-[var(--border-color)] bg-[var(--bg-card)] overflow-hidden shadow-xs my-6">';
        
        // Header
        h += '<div class="p-3 border-b border-[var(--border-color)] bg-[var(--bg-muted)]/40 flex items-center justify-between gap-3 flex-wrap">';
        h += '<div class="flex items-center gap-2">';
        h += '<div class="h-6 w-6 rounded-md bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 flex items-center justify-center">';
        h += '<i data-lucide="database" class="h-3.5 w-3.5"></i>';
        h += '</div>';
        h += '<span class="text-xs font-semibold text-[var(--text-main)]">' + escapeHtml(db.title || 'Database') + '</span>';
        h += '<span class="text-[10px] text-[var(--text-muted)] font-mono bg-[var(--bg-card)] border border-[var(--border-color)] px-1.5 py-0.5 rounded-full">' + rows.length + ' records</span>';
        h += '</div>';

        if (isInteractiveDb) {
          h += '<div class="flex items-center gap-2">';
          h += '<div class="relative">';
          h += '<input id="db-search-' + db.id + '" value="' + escapeHtml(search) + '" placeholder="Search database..." class="text-xs pl-7 pr-2.5 py-1 rounded-lg border border-[var(--border-color)] bg-[var(--bg-card)] text-[var(--text-main)] placeholder-[var(--text-dim)] focus:outline-none focus:ring-1 focus:ring-indigo-500 w-36 sm:w-48" />';
          h += '<i data-lucide="search" class="h-3.5 w-3.5 text-[var(--text-dim)] absolute left-2 top-2"></i>';
          h += '</div>';

          h += '<div class="flex rounded-lg border border-[var(--border-color)] overflow-hidden text-[11px] bg-[var(--bg-card)] p-0.5 shadow-2xs">';
          h += '<button id="btn-table-' + db.id + '" class="px-2.5 py-1 rounded-md flex items-center gap-1 cursor-pointer transition-colors ' + (currentView === 'table' ? 'bg-[var(--bg-accent)] font-semibold text-[var(--text-main)] shadow-2xs' : 'text-[var(--text-muted)] hover:text-[var(--text-main)]') + '"><i data-lucide="table" class="h-3 w-3"></i> Table</button>';
          h += '<button id="btn-gallery-' + db.id + '" class="px-2.5 py-1 rounded-md flex items-center gap-1 cursor-pointer transition-colors ' + (currentView === 'gallery' ? 'bg-[var(--bg-accent)] font-semibold text-[var(--text-main)] shadow-2xs' : 'text-[var(--text-muted)] hover:text-[var(--text-main)]') + '"><i data-lucide="layout-grid" class="h-3 w-3"></i> Gallery</button>';
          h += '</div></div>';
        }
        h += '</div>';

        if (currentView === 'gallery') {
          h += '<div class="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">';
          rows.forEach(r => {
            h += '<div class="p-3.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-card)] shadow-xs hover:border-indigo-500/40 transition-colors space-y-2.5">';
            (db.properties || []).forEach((p, idx) => {
              const val = r.values?.[p.id];
              const propIcon = PROP_ICONS[p.type] || 'circle';
              if (idx === 0) {
                h += '<div class="font-semibold text-xs text-[var(--text-main)] truncate flex items-center gap-1.5"><i data-lucide="file-text" class="h-3.5 w-3.5 text-[var(--text-muted)] shrink-0"></i> <span>' + escapeHtml(r.title || val || 'Untitled') + '</span></div>';
              } else if (val !== undefined && val !== null && val !== '') {
                h += '<div class="text-[11px] flex items-center justify-between gap-2 border-t border-[var(--border-subtle)] pt-1.5"><span class="text-[var(--text-muted)] flex items-center gap-1 shrink-0"><i data-lucide="' + propIcon + '" class="h-3 w-3 opacity-60"></i>' + escapeHtml(p.name) + ':</span><span class="truncate">' + formatCellValue(p, val) + '</span></div>';
              }
            });
            h += '</div>';
          });
          h += '</div>';
        } else {
          h += '<div class="overflow-x-auto"><table class="w-full text-left text-xs border-collapse">';
          h += '<thead class="bg-[var(--bg-muted)]/30 text-[var(--text-muted)] border-b border-[var(--border-color)]"><tr>';
          (db.properties || []).forEach(p => {
            const propIcon = PROP_ICONS[p.type] || 'circle';
            h += '<th class="px-3.5 py-2.5 font-medium tracking-wide text-[11px] border-r border-[var(--border-subtle)] last:border-r-0 whitespace-nowrap"><div class="flex items-center gap-1.5"><i data-lucide="' + propIcon + '" class="h-3.5 w-3.5 opacity-60"></i><span>' + escapeHtml(p.name) + '</span></div></th>';
          });
          h += '</tr></thead><tbody class="divide-y divide-[var(--border-color)]">';
          rows.forEach(r => {
            h += '<tr class="hover:bg-[var(--bg-accent)]/30 transition-colors">';
            (db.properties || []).forEach(p => {
              const val = r.values?.[p.id];
              h += '<td class="px-3.5 py-2.5 align-middle border-r border-[var(--border-subtle)] last:border-r-0">' + formatCellValue(p, val) + '</td>';
            });
            h += '</tr>';
          });
          h += '</tbody>';
          h += '<tfoot class="border-t border-[var(--border-color)] bg-[var(--bg-muted)]/20 text-[var(--text-muted)] text-[11px] font-mono"><tr>';
          (db.properties || []).forEach((p, idx) => {
            if (idx === 0) {
              h += '<td class="px-3.5 py-2 border-r border-[var(--border-subtle)]">Count ' + rows.length + '</td>';
            } else {
              h += '<td class="px-3.5 py-2 border-r border-[var(--border-subtle)]"></td>';
            }
          });
          h += '</tr></tfoot>';
          h += '</table></div>';
        }

        h += '</div>';
        targetContainer.innerHTML = h;

        if (window.lucide) lucide.createIcons();

        const sInput = document.getElementById('db-search-' + db.id);
        if (sInput) {
          sInput.oninput = (e) => { search = e.target.value; draw(); };
        }

        const bGallery = document.getElementById('btn-gallery-' + db.id);
        if (bGallery) bGallery.onclick = () => { currentView = 'gallery'; draw(); };
        const bTable = document.getElementById('btn-table-' + db.id);
        if (bTable) bTable.onclick = () => { currentView = 'table'; draw(); };
      }

      draw();
    }

    // Mount databases
    const dbKeys = Object.keys(allDatabases);
    if (dbKeys.length > 0) {
      dbKeys.forEach(k => {
        const inlineContainer = document.getElementById('db-view-' + k);
        if (inlineContainer) {
          renderSingleDatabase(inlineContainer, allDatabases[k]);
        }
      });

      // ONLY render in #database-viewport if this document itself is a full-page database note
      const isFullPageDb = false;
      const defaultRoot = document.getElementById('database-viewport');
      if (isFullPageDb && defaultRoot && !document.getElementById('db-view-' + dbKeys[0])) {
        renderSingleDatabase(defaultRoot, allDatabases[dbKeys[0]]);
      }

      // Populate sidebar records if full-page database note
      if (isFullPageDb) {
        const sidebarRecs = document.getElementById('sidebar-db-records');
        if (sidebarRecs && allDatabases[dbKeys[0]]) {
          const rootDb = allDatabases[dbKeys[0]];
          const recHtml = (rootDb.rows || []).map(r => {
            return '<div class="flex items-center gap-2 rounded-lg px-2 py-1.5 text-xs text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--bg-accent)] transition-colors truncate cursor-pointer"><i data-lucide="file-text" class="h-3.5 w-3.5 opacity-60 shrink-0"></i><span class="truncate">' + escapeHtml(r.title || 'Untitled') + '</span></div>';
          }).join('');
          sidebarRecs.innerHTML = recHtml;
          if (window.lucide) lucide.createIcons();
        }
      }
    }
  </script>
</body>
</html>
